<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogando — 2D World</title>
    <style>
      .play-top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 16px;
        background: #12141a;
        border-bottom: 1px solid #2d3139;
        font-size: 13px;
      }
      .play-top-bar a { color: #818cf8; text-decoration: none; margin-left: 12px; }
      #canvasContainer { flex: 1; position: relative; min-height: 0; }
      .play-layout { display: flex; flex-direction: column; height: 100vh; }
    </style>
    <script type="module" crossorigin src="/assets/play-BXkd6D9s.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/characterSerializer-NFdx-pyM.js">
    <link rel="modulepreload" crossorigin href="/assets/authGuard-BfF5FsYQ.js">
    <link rel="modulepreload" crossorigin href="/assets/characterStore-u1QC-B7A.js">
    <link rel="modulepreload" crossorigin href="/assets/analytics-RLXdCb65.js">
    <link rel="modulepreload" crossorigin href="/assets/tileDraw-Abl3UYDK.js">
    <link rel="stylesheet" crossorigin href="/assets/style-DlnUPkRF.css">
  </head>
  <body>
    <div class="play-layout">
      <header class="play-top-bar">
        <span><strong id="playCharName">—</strong> · <span id="statusMapName">—</span></span>
        <span>
          <span id="statusPos">0, 0</span> · Z <span id="statusZ">0</span>
          <span id="posX" hidden></span><span id="posY" hidden></span><span id="posZ" hidden></span>
          <a href="/characters.html" id="changeCharLink">Trocar personagem</a>
          <a href="#" id="logoutPlay">Sair</a>
        </span>
      </header>
      <div id="canvasContainer">
        <canvas id="gameCanvas"></canvas>
      </div>
    </div>
    <div id="loadingScreen" class="loading-screen">
      <div class="loading-spinner"></div>
      <p id="loadingMsg">Carregando mundo…</p>
    </div>
  </body>
</html>
